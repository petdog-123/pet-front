<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>宠物管理系统-登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei";
        }
        body {
            background-color: #f8e8f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: #fff;
            width: 360px;
            padding: 30px;
            border-radius: 12px;
        }
        h2 {
            text-align: center;
            color: #b84592;
            margin-bottom: 26px;
        }
        .item {
            margin-bottom: 18px;
        }
        .item input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }
        .check-line {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #555;
        }
        #login-submit {
            width: 100%;
            height: 46px;
            background-color: #b84592;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .reg-tip {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #666;
        }
        .reg-tip a {
            color: #b84592;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>账号登录</h2>
        <div class="item">
            <input type="text" id="login-account" placeholder="手机号/邮箱">
        </div>
        <div class="item">
            <input type="password" id="login-pwd" placeholder="登录密码">
        </div>
        <div class="item check-line">
            <input type="checkbox" id="remember">
            <label for="remember">记住登录（7天）</label>
        </div>
        <div class="item">
            <button id="login-submit">登录</button>
        </div>
        <div class="reg-tip">
            没有账号? <a href="register.html">立即注册</a>
        </div>
    </div>

    <script>
        const loginBtn = document.getElementById('login-submit')
        loginBtn.addEventListener('click', async function () {
            const account = document.getElementById('login-account').value.trim()
            const pwd = document.getElementById('login-pwd').value.trim()
            const isRemember = document.getElementById('remember').checked

            if (!account || !pwd) {
                alert('账号密码不能为空');
                return;
            }
            try {
                const res = await fetch('https://pet-api-server-pjz846j00-pet14.vercel.app/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        account: account,
                        password: pwd
                    })
                });
                const result = await res.json();
                if (result.code === 200) {
                    if (isRemember) {
                        localStorage.setItem('token', result.token);
                        localStorage.setItem('userId', result.userId);
                        localStorage.setItem('remember', '1');
                    } else {
                        sessionStorage.setItem('token', result.token);
                        sessionStorage.setItem('userId', result.userId);
                    }
                    location.href = 'index.html';
                } else {
                    alert(result.msg)
                }
            } catch (err) {
                alert('后端未启动，请打开CMD运行node index.js');
            }
        })
    </script>
</body>
</html>
