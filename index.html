<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>两只狗狗饮食排便管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            padding: 20px 30px;
            background: #fff7fc;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #b84592;
            font-size: 22px;
        }
        #logoutBtn {
            padding: 6px 14px;
            background: #b84592;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .two-dog-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .dog-block {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #f1d7e9;
        }
        h3 {
            color: #b84592;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table th, table td {
            border: 1px solid #ddd;
            padding: 8px;
            font-size: 14px;
            text-align: center;
        }
        table th {
            background: #f8e8f5;
        }
        .add-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .form-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        .form-item {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size:14px;
            margin-bottom:4px;
            color:#444;
        }
        input, select {
            width: 100%;
            height: 36px;
            padding: 0 8px;
            border:1px solid #ddd;
            border-radius:4px;
        }
        textarea {
            width: 100%;
            padding:8px;
            border:1px solid #ddd;
            border-radius:4px;
        }
        button {
            padding: 8px 18px;
            background:#b84592;
            color:#fff;
            border:none;
            border-radius:4px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>宠物饮食&排便记录管理</h1>
        <button id="logoutBtn">退出登录</button>
    </div>

    <div class="two-dog-wrap">
        <div class="dog-block">
            <h3 id="dog1Name">狗狗1</h3>
            <h4>饮食记录</h4>
            <table>
                <thead>
                    <tr>
                        <th>进食时间</th>
                        <th>食物</th>
                        <th>天气</th>
                        <th>心情</th>
                    </tr>
                </thead>
                <tbody id="eatForm1"></tbody>
            </table>

            <h4>排便记录</h4>
            <table>
                <thead>
                    <tr>
                        <th>排便时间</th>
                        <th>便便情况</th>
                        <th>天气</th>
                        <th>心情</th>
                    </tr>
                </thead>
                <tbody id="poopForm1"></tbody>
            </table>
        </div>

        <div class="dog-block">
            <h3 id="dog2Name">狗狗2</h3>
            <h4>饮食记录</h4>
            <table>
                <thead>
                    <tr>
                        <th>进食时间</th>
                        <th>食物</th>
                        <th>天气</th>
                        <th>心情</th>
                    </tr>
                </thead>
                <tbody id="eatForm2"></tbody>
            </table>

            <h4>排便记录</h4>
            <table>
                <thead>
                    <tr>
                        <th>排便时间</th>
                        <th>便便情况</th>
                        <th>天气</th>
                        <th>心情</th>
                    </tr>
                </thead>
                <tbody id="poopForm2"></tbody>
            </table>
        </div>
    </div>

    <div class="add-area">
        <div class="form-card" id="eatFormBox">
            <h3>新增饮食记录</h3>
            <div class="form-item">
                <label>选择狗狗</label>
                <select id="eatDogId">
                    <option value="1">狗狗1</option>
                    <option value="2">狗狗2</option>
                </select>
            </div>
            <div class="form-item">
                <label>食物内容</label>
                <input id="eatFood" placeholder="例如：鸡肉+米饭">
            </div>
            <div class="form-item">
                <label>天气</label>
                <select id="eatWeather">
                    <option value="晴天">晴天</option>
                    <option value="阴天">阴天</option>
                    <option value="雨天">雨天</option>
                </select>
            </div>
            <div class="form-item">
                <label>狗狗心情</label>
                <select id="eatMood">
                    <option value="开心">开心</option>
                    <option value="平常">平常</option>
                    <option value="低落">低落</option>
                </select>
            </div>
            <div class="form-item">
                <label>进食时间</label>
                <input type="datetime-local" id="eatTime">
            </div>
            <button id="submitEat">提交饮食记录</button>
        </div>

        <div class="form-card" id="poopFormBox">
            <h3>新增排便记录</h3>
            <div class="form-item">
                <label>选择狗狗</label>
                <select id="poopDogId">
                    <option value="1">狗狗1</option>
                    <option value="2">狗狗2</option>
                </select>
            </div>
            <div class="form-item">
                <label>排便详情</label>
                <textarea id="poopInfo" rows="3" placeholder="软便、正常、拉稀等"></textarea>
            </div>
            <div class="form-item">
                <label>天气</label>
                <select id="poopWeather">
                    <option value="晴天">晴天</option>
                    <option value="阴天">阴天</option>
                    <option value="雨天">雨天</option>
                </select>
            </div>
            <div class="form-item">
                <label>狗狗心情</label>
                <select id="poopMood">
                    <option value="开心">开心</option>
                    <option value="平常">平常</option>
                    <option value="低落">低落</option>
                </select>
            </div>
            <div class="form-item">
                <label>排便时间</label>
                <input type="datetime-local" id="poopTime">
            </div>
            <button id="submitPoop">提交排便记录</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
