<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>宠物管理-注册账号</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f8e8f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .reg-box {
            width: 360px;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }
        h2 {
            text-align: center;
            color: #b84592;
            margin-bottom: 25px;
        }
        .item {
            margin-bottom: 18px;
        }
        .item input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }
        #reg-btn {
            width: 100%;
            height: 46px;
            background: #b84592;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .login-tip {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
        }
        .login-tip a {
            color: #b84592;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="reg-box">
        <h2>新用户注册</h2>
        <div class="item">
            <input type="text" id="reg-account" placeholder="手机号/邮箱">
        </div>
        <div class="item">
            <input type="password" id="reg-pwd" placeholder="设置密码">
        </div>
        <div class="item">
            <input type="password" id="reg-pwd2" placeholder="确认密码">
        </div>
        <div class="item">
            <button id="reg-btn">完成注册</button>
        </div>
        <div class="login-tip">
            已有账号？<a href="login.html">返回登录</a>
        </div>
    </div>

    <script>
        const submitBtn = document.getElementById('reg-btn')
        submitBtn.addEventListener('click', async function () {
            const account = document.getElementById('reg-account').value.trim()
            const pwd = document.getElementById('reg-pwd').value.trim()
            const pwd2 = document.getElementById('reg-pwd2').value.trim()

            if (!account || !pwd) {
                alert('账号和密码不能为空');
                return;
            }
            if (pwd !== pwd2) {
                alert('两次密码不一致');
                return;
            }

            try {
                const res = await fetch('https://pet-api-server-pjz846j00-pet14.vercel.app/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        account: account,
                        password: pwd
                    })
                })
                const data = await res.json();
                if (data.code === 200) {
                    alert('注册成功，请登录');
                    location.href = 'login.html';
                } else {
                    alert(data.msg)
                }
            } catch (err) {
                alert('后端未启动，请打开CMD运行node index.js');
            }
        })
    </script>
</body>
</html>
